<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transparency Browser</title>
  <style>
    :root {
      --chrome-top: #dee3eb;
      --chrome-toolbar: #eef2f7;
      --chrome-border: #cdd5e1;
      --chrome-text: #202124;
      --btn: #e6ebf3;
      --btn-hover: #d8e0ec;
      --url-bg: #fff;
      --status: #1f2937;
      --page-bg: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(circle at top, #f8faff 0%, #eef3fb 55%, #e7edf8 100%);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--chrome-text);
    }

    .browser {
      width: min(1280px, 100%);
      height: min(820px, calc(100vh - 36px));
      border: 1px solid var(--chrome-border);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background: #fff;
      box-shadow: 0 20px 70px rgba(30, 48, 80, 0.24);
    }

    .tabbar {
      height: 38px;
      background: var(--chrome-top);
      border-bottom: 1px solid var(--chrome-border);
      display: flex;
      align-items: end;
      padding: 0 10px;
    }

    .tab {
      height: 31px;
      min-width: 230px;
      max-width: 420px;
      border: 1px solid #c3cddd;
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      background: #fff;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .tab-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #93a1b7;
      flex: none;
    }

    .toolbar {
      height: 58px;
      background: var(--chrome-toolbar);
      border-bottom: 1px solid var(--chrome-border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
    }

    .btn {
      height: 36px;
      min-width: 36px;
      border-radius: 999px;
      border: 1px solid #c5cfde;
      background: var(--btn);
      cursor: pointer;
      font-size: 15px;
      padding: 0 12px;
    }

    .btn:hover { background: var(--btn-hover); }

    .url {
      flex: 1;
      height: 40px;
      border: 1px solid #c2ccdb;
      border-radius: 999px;
      background: var(--url-bg);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.06);
    }

    .url input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
    }

    .viewport {
      position: relative;
      background: var(--page-bg);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .status {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 12px;
      color: #fff;
      background: color-mix(in srgb, var(--status) 88%, transparent);
      border-radius: 8px;
      padding: 6px 10px;
      max-width: min(90%, 520px);
    }

    .home {
      border: none;
      margin: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .home-wrap { width: min(680px, 88%); text-align: center; }
    .logo { font-size: 44px; margin: 0 0 8px; }
    .subtitle { color: #6b7280; margin: 0 0 20px; }
    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search input {
      height: 46px;
      border: 1px solid #d0d6e1;
      border-radius: 999px;
      padding: 0 18px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="browser">
    <div class="tabbar">
      <div class="tab"><span class="tab-dot"></span> <span id="tabTitle">Transparency Browser</span></div>
    </div>

    <div class="toolbar">
      <button class="btn" id="backBtn" title="Back">◀</button>
      <button class="btn" id="forwardBtn" title="Forward">▶</button>
      <button class="btn" id="reloadBtn" title="Reload">⟳</button>
      <div class="url">
        <span>🔒</span>
        <input id="urlInput" value="home" />
      </div>
      <button class="btn" id="goBtn">Go</button>
      <button class="btn" id="homeBtn">Home</button>
    </div>

    <div class="viewport">
      <iframe id="view" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="status" id="status">Ready (single-file mode: file://)</div>
    </div>
  </div>

  <template id="homeTemplate">
    <div class="home">
      <div class="home-wrap">
        <h1 class="logo">Transparency Browser</h1>
        <p class="subtitle">Single-file browser shell. Search opens in this frame when allowed by target site headers.</p>
        <form class="search" id="searchForm">
          <input id="searchInput" placeholder="Search Google" autocomplete="off" />
          <button class="btn" type="submit">Search</button>
        </form>
      </div>
    </div>
  </template>

  <script>
    const frame = document.getElementById('view');
    const urlInput = document.getElementById('urlInput');
    const statusEl = document.getElementById('status');
    const tabTitle = document.getElementById('tabTitle');

    const historyStack = [];
    let historyIndex = -1;

    const setStatus = (m) => statusEl.textContent = m;

    const normalize = (v) => {
      const input = (v || '').trim();
      if (!input || input.toLowerCase() === 'home') return 'home';
      if (/^https?:\/\//i.test(input) || /^file:\/\//i.test(input)) return input;
      if (input.includes(' ') || !input.includes('.')) return `https://www.google.com/search?q=${encodeURIComponent(input)}`;
      return `https://${input}`;
    };

    const homeHtml = () => document.getElementById('homeTemplate').innerHTML;

    const renderHome = () => {
      frame.srcdoc = homeHtml();
      urlInput.value = 'home';
      tabTitle.textContent = 'Transparency Browser';
      document.title = 'Transparency Browser';
      setStatus('Home loaded. Tip: try "openai.com" or any search words in the URL bar.');
      setTimeout(bindHomeEvents, 0);
    };

    const bindHomeEvents = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      const form = doc.getElementById('searchForm');
      const searchInput = doc.getElementById('searchInput');
      if (!form || !searchInput) return;
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        navigate(searchInput.value);
      });
    };

    const pushHistory = (url) => {
      if (historyStack[historyIndex] === url) return;
      historyStack.splice(historyIndex + 1);
      historyStack.push(url);
      historyIndex = historyStack.length - 1;
    };

    const navigate = (raw, fromHistory = false) => {
      const target = normalize(raw);
      if (!fromHistory) pushHistory(target);

      if (target === 'home') {
        renderHome();
        return;
      }

      urlInput.value = target;
      tabTitle.textContent = target.replace(/^https?:\/\//, '').slice(0, 60);
      document.title = `${tabTitle.textContent} · Transparency Browser`;
      frame.removeAttribute('srcdoc');
      frame.src = target;
      setStatus('Navigating… If blocked by X-Frame-Options/CSP, use right click → Open frame in new tab.');
    };

    frame.addEventListener('load', () => {
      const current = urlInput.value;
      try {
        const title = frame.contentDocument?.title;
        if (title) tabTitle.textContent = title.slice(0, 70);
      } catch (_) {
        // Cross-origin access blocked; this is expected for many sites.
      }
      setStatus(`Loaded: ${current}`);
    });

    document.getElementById('goBtn').addEventListener('click', () => navigate(urlInput.value));
    document.getElementById('homeBtn').addEventListener('click', () => navigate('home'));
    document.getElementById('reloadBtn').addEventListener('click', () => {
      if (urlInput.value === 'home') return renderHome();
      frame.src = frame.src;
      setStatus('Reloaded.');
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      if (historyIndex <= 0) return setStatus('No back history.');
      historyIndex -= 1;
      navigate(historyStack[historyIndex], true);
    });
    document.getElementById('forwardBtn').addEventListener('click', () => {
      if (historyIndex >= historyStack.length - 1) return setStatus('No forward history.');
      historyIndex += 1;
      navigate(historyStack[historyIndex], true);
    });
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate(urlInput.value);
    });

    navigate('home');
  </script>
</body>
</html>
