<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transparency Browser</title>
  <style>
    :root {
      --bg: #f1f3f4;
      --toolbar: #eef1f5;
      --tab: #dbe1ea;
      --url-bg: #ffffff;
      --border: #d0d7de;
      --text: #202124;
      --btn-hover: #d8dee8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f6f8fb 0%, #edf1f7 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .browser-shell {
      width: min(1200px, 100%);
      height: min(760px, calc(100vh - 48px));
      background: #fff;
      border-radius: 16px;
      border: 1px solid #cad3df;
      box-shadow: 0 18px 60px rgba(38, 50, 77, 0.22);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .tab-strip {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px 0;
      gap: 8px;
      min-height: 38px;
    }

    .tab {
      background: white;
      border: 1px solid #c8d2df;
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      min-width: 200px;
      max-width: 320px;
      height: 32px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa0a6;
    }

    .toolbar {
      background: var(--toolbar);
      border-bottom: 1px solid var(--border);
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button, select {
      border: 1px solid #c6ceda;
      background: #e8edf5;
      color: #2f3640;
      border-radius: 999px;
      height: 34px;
      min-width: 34px;
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
      transition: .15s;
    }

    button:hover, select:hover { background: var(--btn-hover); }

    .url-bar {
      flex: 1;
      display: flex;
      align-items: center;
      border: 1px solid #c4ccd8;
      background: var(--url-bg);
      border-radius: 999px;
      overflow: hidden;
      padding: 0 8px;
      height: 38px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04) inset;
    }

    .url-bar span {
      color: #5f6368;
      margin-right: 6px;
    }

    input[type="url"] {
      border: none;
      outline: none;
      width: 100%;
      height: 100%;
      font-size: 14px;
      background: transparent;
    }

    .viewer {
      background: #fff;
      position: relative;
    }

    #contentFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .status {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(22, 28, 45, 0.85);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <div class="browser-shell">
    <div class="tab-strip">
      <div class="tab"><span class="dot"></span><span id="tabTitle">Transparency Browser</span></div>
    </div>

    <div class="toolbar">
      <button id="backBtn" title="Back">◀</button>
      <button id="forwardBtn" title="Forward">▶</button>
      <button id="reloadBtn" title="Reload">⟳</button>
      <div class="url-bar">
        <span>🔒</span>
        <input id="urlInput" type="url" value="https://www.google.com" />
      </div>
      <button id="goBtn">Go</button>
      <select id="engineSelect" title="Engine">
        <option value="playwright">Playwright Chrome</option>
        <option value="puppeteer">Puppeteer Chrome</option>
      </select>
      <label style="font-size:12px;display:flex;align-items:center;gap:6px;padding:0 8px;">
        <input id="headlessToggle" type="checkbox" checked /> Headless
      </label>
      <button id="newSessionBtn">New Session</button>
    </div>

    <div class="viewer">
      <iframe id="contentFrame" sandbox="allow-forms allow-same-origin allow-scripts"></iframe>
      <div class="status" id="status">Initializing…</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const frame = document.getElementById('contentFrame');
    const urlInput = document.getElementById('urlInput');
    const tabTitle = document.getElementById('tabTitle');

    let sessionId = null;

    const setStatus = (text) => statusEl.textContent = text;

    const callApi = async (path, method = 'POST', body) => {
      const response = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });

      if (response.status === 204) return null;
      const json = await response.json();
      if (!response.ok) throw new Error(json.error || 'Request failed');
      return json;
    };

    const renderPage = ({ html, title, url }) => {
      frame.srcdoc = html;
      tabTitle.textContent = title || 'New Tab';
      document.title = `${title || 'Transparency Browser'} · Transparency Browser`;
      urlInput.value = url;
      setStatus(`Loaded: ${new URL(url).hostname}`);
    };

    const createSession = async () => {
      setStatus('Starting cloud browser…');
      if (sessionId) {
        await fetch(`/api/session/${sessionId}`, { method: 'DELETE' });
      }

      const engine = document.getElementById('engineSelect').value;
      const headless = document.getElementById('headlessToggle').checked;
      const data = await callApi('/api/session', 'POST', { engine, headless });
      sessionId = data.sessionId;
      renderPage(data);
    };

    const runAction = async (action, body = null) => {
      if (!sessionId) return;
      setStatus('Loading…');
      const data = await callApi(`/api/session/${sessionId}/${action}`, 'POST', body);
      renderPage(data);
    };

    document.getElementById('goBtn').addEventListener('click', () => runAction('navigate', { url: urlInput.value }));
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runAction('navigate', { url: urlInput.value });
    });
    document.getElementById('backBtn').addEventListener('click', () => runAction('back'));
    document.getElementById('forwardBtn').addEventListener('click', () => runAction('forward'));
    document.getElementById('reloadBtn').addEventListener('click', () => runAction('reload'));
    document.getElementById('newSessionBtn').addEventListener('click', createSession);

    window.addEventListener('beforeunload', () => {
      if (sessionId) navigator.sendBeacon(`/api/session/${sessionId}`);
    });

    createSession().catch((error) => {
      console.error(error);
      setStatus(`Error: ${error.message}`);
    });
  </script>
</body>
</html>
